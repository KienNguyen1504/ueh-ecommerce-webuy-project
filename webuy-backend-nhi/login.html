<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | WeBuy</title>
  <meta name="description" content="Đăng nhập hoặc tạo tài khoản WeBuy để mua chung, lưu giỏ hàng và đơn hàng.">
  <link rel="icon" type="image/png" href="images/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="wb-page">
  <header class="wb-topbar">
    <a class="wb-brand" href="index.html" aria-label="WeBuy - Trang chủ">
      <img src="images/logo-mark.png" alt="" width="40" height="40">
      <span>We<span>Buy</span></span>
    </a>
    <a class="wb-back" href="index.html" data-back>← Quay lại mua sắm</a>
  </header>

  <main class="wb-main">
    <div class="wb-auth">
      <section class="wb-auth-hero" aria-hidden="true">
        <h1>Mua chung,<br>giá tốt hơn.</h1>
        <p>Một tài khoản để lưu giỏ hàng, theo dõi đơn và nhóm mua trên mọi thiết bị.</p>
        <ul>
          <li>Giỏ hàng đồng bộ giữa các máy</li>
          <li>Theo dõi đơn và thông báo</li>
          <li>Mở cửa hàng trong Seller Center</li>
        </ul>
      </section>

      <section class="wb-card" aria-labelledby="auth-title">
        <h2 id="auth-title" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Tài khoản WeBuy</h2>
        <div class="wb-tabs" role="tablist" aria-label="Đăng nhập hoặc đăng ký">
          <button class="wb-tab" type="button" role="tab" id="tab-login" aria-controls="form-login" aria-selected="true">Đăng nhập</button>
          <button class="wb-tab" type="button" role="tab" id="tab-signup" aria-controls="form-signup" aria-selected="false" tabindex="-1">Đăng ký</button>
        </div>

        <p class="wb-alert wb-alert-info" id="auth-reason" hidden></p>
        <p class="wb-alert" id="auth-message" role="alert" hidden></p>

        <form class="wb-form" id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div class="wb-field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required maxlength="120">
          </div>
          <div class="wb-field">
            <label for="login-password">Mật khẩu</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="6">
          </div>
          <button class="wb-btn wb-btn-primary" type="submit">Đăng nhập</button>
        </form>

        <form class="wb-form" id="form-signup" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
          <div class="wb-field">
            <label for="signup-name">Họ và tên</label>
            <input id="signup-name" name="name" autocomplete="name" required maxlength="80">
          </div>
          <div class="wb-field">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" autocomplete="email" required maxlength="120">
          </div>
          <div class="wb-field">
            <label for="signup-password">Mật khẩu</label>
            <input id="signup-password" name="password" type="password" autocomplete="new-password" required minlength="6" aria-describedby="signup-password-hint">
            <small id="signup-password-hint">Ít nhất 6 ký tự.</small>
          </div>
          <div class="wb-field">
            <label for="signup-confirm">Nhập lại mật khẩu</label>
            <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" required minlength="6">
          </div>
          <button class="wb-btn wb-btn-accent" type="submit">Tạo tài khoản</button>
        </form>

        <p class="wb-demo-note" id="auth-mode-note"></p>
      </section>
    </div>
  </main>

  <script src="js/catalog-data.js"></script>
  <script src="js/api-config.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/login-page.js"></script>
</body>
</html>
